# EIPS brand theme -- MML's blue-and-white identity, applied through
# Streamlit's built-in theming (no logo needed). This affects every page
# automatically: buttons, tabs, sliders, sidebar, metrics, and form
# widgets all pick up primaryColor / backgroundColor / secondaryBackgroundColor
# below, everywhere in the app, with no per-page code changes.
#
# Streamlit's layout is responsive by default (every page already uses
# layout="wide" -- see app.py / pages/*.py): columns and the sidebar
# automatically reflow for phone and tablet widths, so no extra work is
# needed there -- this file only sets the color identity.

[theme]
base = "light"

# Primary brand blue -- used for buttons, active tabs/widgets, links,
# sliders, and selection highlights. Matches the blue already used as the
# accent color on the sign-in screen (src/utils/auth_ui.py) and as the
# first chart color (src/utils/viz_theme.py), so the whole app reads as
# one consistent identity.
primaryColor = "#184f95"

# Main content background -- white.
backgroundColor = "#FFFFFF"

# Sidebar / widget background -- a very light blue tint, not flat white,
# so panels and the sidebar read as part of the same MML blue-and-white
# palette rather than plain gray.
secondaryBackgroundColor = "#EAF2FB"

# Body text -- a dark navy-charcoal rather than pure black, softer against
# the blue accents while staying highly readable.
textColor = "#1B2734"

font = "sans serif"
